# Builds the AgentHub desktop installers and publishes them as a GitHub Release.
# Start it by pushing a tag like desktop-v0.1.0 (or "Run workflow" in the Actions tab).
# The homepage download buttons always point at the latest release's files.
name: Desktop app release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. desktop-v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, script: dist:mac, file: AgentHub-mac.dmg }
          - { name: Windows, os: windows-latest, script: dist:win, file: AgentHub-windows-setup.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    # No Apple or Windows certificates yet: the Mac app is ad-hoc signed (identity "-" in
    # desktop/package.json) so it can run on Apple silicon; Windows is unsigned.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check the tag matches the pushed app version
        # Stops a build of old code: the tag must equal "version" in desktop/package.json on this commit.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          WANT="${TAG#desktop-v}"
          HAVE="$(node -p "require('./package.json').version")"
          echo "Commit ${GITHUB_SHA::7}: desktop/package.json says $HAVE, tag says $WANT"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::Tag $TAG doesn't match desktop/package.json ($HAVE) on commit ${GITHUB_SHA::7}. Push your latest code first, then run the workflow again with tag desktop-v$HAVE."
            exit 1
          fi
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Launch test (the built app must start)
        # Starts the packaged app for 25 s and checks it got through startup; a broken app isn't published.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="$(find release -path '*AgentHub.app/Contents/MacOS/AgentHub' -type f | head -1)"
            LOG="$HOME/Library/Application Support/AgentHub/connector.log"
          else
            APP="release/win-unpacked/AgentHub.exe"
            LOG="$APPDATA/AgentHub/connector.log"
          fi
          echo "Starting $APP"
          "$APP" > launch.out 2>&1 &
          PID=$!
          sleep 25
          kill $PID 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM AgentHub.exe >/dev/null 2>&1 || true; fi
          echo "--- app output"; cat launch.out || true
          echo "--- app log"; cat "$LOG" || true
          if grep -qiE "threw an error during load|Uncaught Exception" launch.out; then echo "::error::The app crashed while starting."; exit 1; fi
          grep -q "starting on" "$LOG" || { echo "::error::The app didn't finish starting (no startup line in its log)."; exit 1; }
          echo "The app started correctly."
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: desktop/release/${{ matrix.file }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AgentHub ${{ github.event.inputs.tag || github.ref_name }}
          make_latest: 'true'
          files: |
            installers/AgentHub-mac.dmg
            installers/AgentHub-windows-setup.exe
          body: |
            Download AgentHub for your computer. Built from commit ${{ github.sha }}.

            - **macOS** (Apple silicon and Intel, macOS 12+): `AgentHub-mac.dmg`
            - **Windows** (10 and 11, 64-bit): `AgentHub-windows-setup.exe`

            These builds aren't signed with Apple or Microsoft yet, so the first launch needs one extra step:
            - **macOS 15 (Sequoia) and later:** open AgentHub once, click **Done** on the warning, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
            - **macOS 12–14:** right-click AgentHub in Applications and choose **Open**, then **Open** again.
            - **Windows:** if SmartScreen appears, click **More info → Run anyway**.
